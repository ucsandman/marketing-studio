name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        working-directory: studio
      - run: npm test
        working-directory: studio
      - run: npm run lint
        working-directory: studio
      - run: npm ci
        working-directory: feeders/capture
      - run: npm ci
        working-directory: feeders/diagram
      - run: npm test
        working-directory: feeders/diagram
      - name: script-side tests
        run: |
          set -e
          # scripts/lib/*.test.mjs was never in this glob, so every colocated lib
          # test (cache, drift, png, matrix-props, wrap-contract, magnetic-sidecar,
          # teaser-colors) was written and then never run by CI.
          files=(scripts/*.test.mjs scripts/lib/*.test.mjs feeders/capture/*.test.mjs feeders/audio/*.test.mjs feeders/comfy/*.test.mjs)
          node --test "${files[@]}"
          echo "verify: ran ${#files[@]} test files"
      - name: Python workspace boundary tests
        run: python -m unittest discover -s feeders -p 'test_workspace.py' -v

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        working-directory: studio
      - name: render smoke stills
        run: node scripts/smoke.mjs --out-dir "$RUNNER_TEMP/marketing-studio-smoke"
      - name: count rendered stills
        run: |
          count=$(find "$RUNNER_TEMP/marketing-studio-smoke" -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "verify: rendered $count stills"
          test "$count" -eq 13
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-stills
          path: ${{ runner.temp }}/marketing-studio-smoke/*.png

  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 22 like the jobs above: launch/package.json declares engines >=24.
          node-version: 24
      - run: npm ci
        working-directory: launch
      - run: npm run build
        working-directory: launch
      - run: npm test
        working-directory: launch
      - run: npm run lint
        working-directory: launch
